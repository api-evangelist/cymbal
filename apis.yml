name: Cymbal
description: 'Cymbal was a consumer blockchain data startup founded in 2022 in Menlo Park by Eric Feng,
  Nick Chang and others, building a "human readable" Ethereum block explorer with a visual, social interface
  and AI-generated conversational summaries of wallets, NFTs and transactions. The company raised $18.5M in
  2023 from investors including First Round Capital, Coinbase Ventures, Solana Ventures, Patron, Acrew and
  GV. In July 2025 Yahoo acqui-hired the Cymbal team into a new AI research group. Cymbal published no public
  developer API or documentation surface; this API Evangelist profile is a GV-portfolio company record.'
